<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carseus Lai - Job Tracker</title>
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--text:#1f2328;--muted:#656d76;--line:#d8dee4;--chip:#eef1f4;
  --accent:#2563eb;--accent-text:#ffffff;--accent-tint:rgba(37,99,235,.10);
  --a:#1f883d;--b:#b0790f;--c:#6e7781;
  --shadow:0 1px 3px rgba(31,35,40,.08)
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;--card:#171a21;--text:#e6e8eb;--muted:#9aa3ad;--line:#2a2f37;--chip:#20242c;
    --accent:#4f8cff;--accent-text:#ffffff;--accent-tint:rgba(79,140,255,.16);
    --a:#3fb950;--b:#d29922;--c:#8b949e;
    --shadow:none
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-size:.9em;background:var(--chip);padding:1px 5px;border-radius:4px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header h1{margin:0;font-size:1.5em}
.sub{color:var(--muted);font-size:.88em}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0;box-shadow:var(--shadow)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
.flabel{width:44px;flex-shrink:0;color:var(--muted);font-size:.85em}
.frow > span[id]{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer;font:inherit;font-size:.88em;line-height:1.5;text-decoration:line-through;text-decoration-color:var(--line)}
.chip.on{background:var(--accent-tint);border-color:var(--accent);color:var(--text);text-decoration:none}
.chip .n{opacity:.75;margin-left:3px;font-size:.9em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.tools select,.tools input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9em}
.tools input{flex:1;min-width:160px}
.summary{color:var(--muted);font-size:.85em}
.summary b{color:var(--text)}
.link-btn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.85em;padding:0}
.why{color:var(--muted);font-size:.8em;margin-top:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.company{font-weight:700}
.country{color:var(--muted);font-weight:400;font-size:.85em;margin-left:4px}
.title{font-size:1.02em;font-weight:600;line-height:1.35}
.meta{color:var(--muted);font-size:.84em}
.badges{display:flex;gap:6px;flex-shrink:0}
.tier{font-size:.72em;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff}
.tier-A{background:var(--a)}.tier-B{background:var(--b)}.tier-C{background:var(--c)}
.st{font-size:.72em;font-weight:600;border-radius:5px;padding:0 7px;border:1px solid var(--line);color:var(--muted)}
.st-applied,.st-interview,.st-offer{border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;font-size:.76em;background:var(--chip);color:var(--muted);border-radius:5px;padding:0 7px;margin-right:4px}
.kv{font-size:.88em}.kv b{font-weight:600}
.notes{font-size:.88em;background:var(--chip);border-radius:8px;padding:6px 10px}
.empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}

section{margin-top:34px}
h2{font-size:1.1em;border-bottom:1px solid var(--line);padding-bottom:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.88em;vertical-align:top}
th{background:var(--chip);font-weight:600}
tr:last-child td{border-bottom:0}
ul{padding-left:20px}
footer{margin-top:40px;color:var(--muted);font-size:.78em;text-align:center}
@media (max-width:600px){.grid{grid-template-columns:1fr}.flabel{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Job Tracker</h1>
  <div class="sub">私人求職追蹤頁 · 資料更新 <b>__UPDATED__</b> · 由 <code>/g-jobs</code> 維護</div>
</header>

<div class="panel" role="region" aria-label="篩選">
  <div class="frow"><span class="flabel">等級</span><span id="f-tiers"></span></div>
  <div class="frow"><span class="flabel">地區</span><span id="f-regions"></span></div>
  <div class="frow"><span class="flabel">技能</span><span id="f-skills"></span></div>
  <div class="tools">
    <select id="status" aria-label="狀態篩選"><option value="">全部狀態</option></select>
    <input id="q" type="search" placeholder="搜尋公司、職稱、備註…" aria-label="搜尋">
    <span class="summary" id="summary"></span>
    <button class="link-btn" id="reset" type="button">恢復推薦</button>
    <button class="link-btn" id="all" type="button">全部顯示</button>
  </div>
  <div class="why" id="why"></div>
</div>

<div class="grid" id="list"></div>

<section>
  <h2>薪資基準（年薪，新台幣）</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>參考</th><th>區間</th><th>來源</th></tr></thead>
    <tbody id="benchBody"></tbody>
  </table></div>
</section>

<section>
  <h2>目標與條件</h2>
  <div id="profile"></div>
</section>

<section>
  <h2>更新紀錄</h2>
  <ul id="log"></ul>
</section>

<footer>此頁在瀏覽器端以 staticrypt 解密；公開 repo 只有密文。建置時間 __BUILT_AT__</footer>
</div>

<script id="jobs-data" type="application/json">__JOBS_JSON__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('jobs-data').textContent);
  const statuses = data.statuses || {};
  const F = data.filters || {};
  const D = F.defaults || {};
  const TIERS = ['A', 'B', 'C'];
  const REGIONS = F.regions || [];
  const SKILLS = F.skills || [];
  const tierOrder = { A: 0, B: 1, C: 2 };
  const statusOrder = ['interview', 'offer', 'applied', 'todo', 'watch', 'rejected', 'closed'];
  const STORE = 'job-tracker-filters-v1';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // "約 2026-09-16" and "2026-09-16" must sort together; undated entries go last.
  const dateKey = s => (String(s).match(/\d{4}-\d{2}(-\d{2})?/) || [''])[0];

  const recommended = () => ({
    tiers: new Set(D.tiers || TIERS),
    regions: new Set(D.regions || REGIONS),
    skills: new Set(D.skills || SKILLS),
  });
  const everything = () => ({ tiers: new Set(TIERS), regions: new Set(REGIONS), skills: new Set(SKILLS) });

  // Per-viewer convenience only: the page must work when storage is blocked.
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return recommended();
      const o = JSON.parse(raw);
      return { tiers: new Set(o.tiers), regions: new Set(o.regions), skills: new Set(o.skills) };
    } catch (e) { return recommended(); }
  }
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ tiers: [...sel.tiers], regions: [...sel.regions], skills: [...sel.skills] }));
    } catch (e) { /* ignore */ }
  }

  let sel = load();
  let status = '', q = '';

  const countBy = key => data.jobs.reduce((m, j) => (m[j[key]] = (m[j[key]] || 0) + 1, m), {});
  const counts = { tiers: countBy('tier'), regions: countBy('region'), skills: countBy('skill') };

  function chips(el, group, values, labelOf) {
    el.innerHTML = '';
    values.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (sel[group].has(v) ? ' on' : '');
      b.setAttribute('aria-pressed', sel[group].has(v));
      b.innerHTML = `${esc(labelOf ? labelOf(v) : v)}<span class="n">${counts[group][v] || 0}</span>`;
      b.onclick = () => {
        sel[group].has(v) ? sel[group].delete(v) : sel[group].add(v);
        save(); drawChips(); render();
      };
      el.appendChild(b);
    });
  }
  function drawChips() {
    chips(document.getElementById('f-tiers'), 'tiers', TIERS, v => v + ' 級');
    chips(document.getElementById('f-regions'), 'regions', REGIONS);
    chips(document.getElementById('f-skills'), 'skills', SKILLS);
  }

  const st = document.getElementById('status');
  statusOrder.forEach(s => { if (!statuses[s]) return; const o = document.createElement('option'); o.value = s; o.textContent = statuses[s]; st.appendChild(o); });
  st.onchange = () => { status = st.value; render(); };
  document.getElementById('q').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
  document.getElementById('reset').onclick = () => { sel = recommended(); save(); drawChips(); render(); };
  document.getElementById('all').onclick = () => { sel = everything(); save(); drawChips(); render(); };
  document.getElementById('why').textContent = F.why || '';

  function match(j) {
    if (!sel.tiers.has(j.tier) || !sel.regions.has(j.region) || !sel.skills.has(j.skill)) return false;
    if (status && j.status !== status) return false;
    if (q) {
      const hay = [j.company, j.title, j.location, j.fit, j.gap, j.notes, j.country, j.region, j.skill].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function card(j) {
    return `<article class="card">
  <div class="top">
    <div><span class="company">${esc(j.company)}</span><span class="country">${esc(j.country)}</span></div>
    <div class="badges"><span class="tier tier-${esc(j.tier)}">${esc(j.tier)}</span><span class="st st-${esc(j.status)}">${esc(statuses[j.status] || j.status)}</span></div>
  </div>
  <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)} ↗</a></div>
  <div class="meta"><span class="tag">${esc(j.region)}</span><span class="tag">${esc(j.skill)}</span>${esc(j.location)} · 貼文 ${esc(j.posted)}</div>
  ${j.fit ? `<div class="kv"><b>對口</b>：${esc(j.fit)}</div>` : ''}
  ${j.gap ? `<div class="kv"><b>缺口</b>：${esc(j.gap)}</div>` : ''}
  ${j.notes ? `<div class="notes">${esc(j.notes)}</div>` : ''}
</article>`;
  }

  function render() {
    const rows = data.jobs.filter(match).sort((a, b) =>
      (tierOrder[a.tier] - tierOrder[b.tier]) ||
      (statusOrder.indexOf(a.status) - statusOrder.indexOf(b.status)) ||
      dateKey(b.posted).localeCompare(dateKey(a.posted)));
    document.getElementById('list').innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty">沒有符合的職缺，按「恢復推薦」或「全部顯示」</div>';
    document.getElementById('summary').innerHTML = `顯示 <b>${rows.length}</b> / ${data.jobs.length} 筆`;
  }

  drawChips();
  render();

  document.getElementById('benchBody').innerHTML = (data.benchmarks || []).map(b =>
    `<tr><td>${esc(b.label)}</td><td>${esc(b.range)}</td><td><a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${esc(b.source)}</a></td></tr>`).join('');

  const p = data.profile || {};
  document.getElementById('profile').innerHTML =
    `<p><b>${esc(p.headline || '')}</b></p><ul>${(p.targets || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` +
    `<p class="meta">關鍵字：${(p.keywords || []).map(esc).join(' · ')}</p>`;

  document.getElementById('log').innerHTML = (data.log || []).slice().reverse().map(l => `<li><b>${esc(l.date)}</b> ${esc(l.text)}</li>`).join('');
})();
</script>
</body>
</html>
