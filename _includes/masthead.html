<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{% if link.title_zh %}<span class="lang-zh">{{ link.title_zh }}</span><span class="lang-en">{{ link.title }}</span>{% else %}{{ link.title }}{% endif %}</a></li>
          {% endfor %}
          <li class="masthead__menu-item"><a href="#" role="button" data-lang-toggle>中文 / EN</a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
